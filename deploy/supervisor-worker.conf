; /etc/supervisor/conf.d/hotspot-billing-worker.conf
;
; Runs the Laravel queue worker that processes ActivateHotspotUserJob
; (see app/Jobs/ActivateHotspotUserJob.php). Without this running,
; payments/vouchers will mark subscriptions active in the database but
; NO ONE WILL ACTUALLY GET CONNECTED — the MikroTik provisioning step
; only happens via this queue, never synchronously (see
; SubscriptionService::activateSubscription and the Phase 9 docs on why).
;
; After copying into place:
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl start hotspot-billing-worker:*

[program:hotspot-billing-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/hotspot-billing/backend/artisan queue:work database --sleep=3 --tries=3 --max-time=3600
directory=/var/www/hotspot-billing/backend
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/hotspot-billing/worker.log
stopwaitsecs=3600
