# /etc/nginx/sites-available/hotspot-billing-api
#
# Serves the Laravel API on api.yourdomain.com. Adjust `server_name`,
# `root`, and the PHP-FPM socket path for your PHP version before use.
#
# After copying into place:
#   sudo ln -s /etc/nginx/sites-available/hotspot-billing-api /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name api.yourdomain.com;

    # Certbot (see PRODUCTION_SECURITY.md) rewrites this block to add a
    # 443 server + redirect once SSL is issued — leave the ACME challenge
    # path reachable over plain HTTP for that to work.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name api.yourdomain.com;

    # Populated by certbot --nginx (see PRODUCTION_SECURITY.md)
    # ssl_certificate     /etc/letsencrypt/live/api.yourdomain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.yourdomain.com/privkey.pem;

    root /var/www/hotspot-billing/backend/public;
    index index.php;

    # Laravel's front controller pattern
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        # Adjust for your PHP version if not 8.3
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Never serve .env, storage internals, or vendor directly
    location ~ /\.(?!well-known).* {
        deny all;
    }

    client_max_body_size 10M;

    access_log /var/log/nginx/hotspot-billing-api.access.log;
    error_log  /var/log/nginx/hotspot-billing-api.error.log;
}
