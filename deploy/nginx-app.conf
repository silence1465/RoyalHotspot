# /etc/nginx/sites-available/hotspot-billing-app
#
# Serves the built React app (frontend/dist) on app.yourdomain.com.
# This is the customer captive-portal + admin panel entry point.

server {
    listen 80;
    server_name app.yourdomain.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name app.yourdomain.com;

    # ssl_certificate     /etc/letsencrypt/live/app.yourdomain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/app.yourdomain.com/privkey.pem;

    root /var/www/hotspot-billing/frontend/dist;
    index index.html;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' http: https:; object-src 'none'" always;

    # Keep API calls same-origin for devices that are still behind the
    # MikroTik captive portal. Browsers do not need direct pre-auth access
    # to the separate API origin.
    location /api/ {
        proxy_pass https://api.yourdomain.com;
        proxy_ssl_server_name on;
        proxy_set_header Host api.yourdomain.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router uses client-side routing (BrowserRouter) — every path
    # that isn't a real file falls back to index.html so deep links like
    # /admin/subscriptions work on a hard refresh instead of 404ing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|svg|png|jpg|jpeg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    access_log /var/log/nginx/hotspot-billing-app.access.log;
    error_log  /var/log/nginx/hotspot-billing-app.error.log;
}
